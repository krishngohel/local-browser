name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
            artifact: "dist-installer/Echo-Setup-*.exe"
          - os: macos-latest
            dist: dist:mac
            artifact: "dist-installer/Echo-*.dmg"
          - os: ubuntu-latest
            dist: dist:linux
            artifact: "dist-installer/Echo-*.AppImage"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run packaging:check
      - run: npm run test:bridge
      - run: npm run ${{ matrix.dist }}
      - name: Test packaged Windows Claude bridge
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ECHO_BRIDGE_EXECUTABLE = (Resolve-Path "dist-installer/win-unpacked/Echo.exe").Path
          $env:ECHO_BRIDGE_RESOURCES = (Resolve-Path "dist-installer/win-unpacked/resources").Path
          node scripts/test-echo-mcp-bridge.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: echo-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
          body: |
            Unsigned installers. Mac: drag Echo to Applications, then right-click → Open (or System Settings → Privacy & Security → Open Anyway). Windows: SmartScreen More info → Run anyway.
